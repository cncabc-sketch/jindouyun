name: Update VPNGate mirror

on:
  schedule:
    # Offset from quarter-hour peaks because GitHub may delay busy schedules.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-vpngate-mirror.yml"
      - "scripts/build_vpngate_mirror.py"
      - "snapshot_utils.py"

# Publishing goes to the gh-pages branch with the plain workflow token.
# (The previous actions/deploy-pages flow never worked here: this repo has
# never had a Pages site enabled in Settings, so configure-pages failed with
# "Get Pages site failed ... Not Found", and auto-enablement is not available
# to the workflow token on this account.)
permissions:
  contents: write

concurrency:
  group: vpngate-pages-mirror
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Fetch and validate VPNGate snapshot
        run: python scripts/build_vpngate_mirror.py --output-dir _site
      - name: Publish mirror snapshot to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch _site/.nojekyll
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update VPNGate mirror $(date -u +%FT%TZ)"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
